name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: disk-analyzer
            asset_name: disk-analyzer
          - os: windows-latest
            artifact: disk-analyzer.exe
            asset_name: disk-analyzer.exe
          - os: macos-latest
            artifact: disk-analyzer
            asset_name: disk-analyzer-macos

    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Build
        env:
          PYTHONUTF8: "1"
        run: python build.py

      - name: Rename artifact
        shell: bash
        if: matrix.artifact != matrix.asset_name
        run: mv dist/${{ matrix.artifact }} dist/${{ matrix.asset_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/disk-analyzer
            dist/disk-analyzer-macos
            dist/disk-analyzer.exe
          generate_release_notes: true

      - name: Update README version links
        run: |
          VERSION=${GITHUB_REF_NAME}
          sed -i "s|/download/v[0-9]*\.[0-9]*\.[0-9]*/|/download/${VERSION}/|g" README.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "Update README download links to ${VERSION}"
          git push origin HEAD:master
